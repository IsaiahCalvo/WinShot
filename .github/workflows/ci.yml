name: ci

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-package-smoke:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Windows 10 SDK 10.0.19041 (UAP Platform.xml for CsWinRT)
        shell: pwsh
        run: choco install windows-sdk-10-version-2004-all -y --no-progress
      - name: Verify Windows SDK for CsWinRT
        shell: pwsh
        run: |
          $platformXml = "${env:ProgramFiles(x86)}\Windows Kits\10\Platforms\UAP\10.0.19041.0\Platform.xml"
          if (-not (Test-Path $platformXml)) { throw "Missing Windows SDK Platform.xml at $platformXml" }
          Write-Host "Found $platformXml"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Test
        run: dotnet test tests/WinShot.Tests/WinShot.Tests.csproj -c Release --nologo
      - name: Publish release package
        run: dotnet publish src/WinShot/WinShot.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -p:PublishSingleFile=false -p:Version=0.0.0 -o publish/WinShot --nologo
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/WinShot/* -DestinationPath WinShot-win-x64.zip -Force
      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "/DMyAppVersion=0.0.0" "installer\WinShot.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
      - name: Verify release package outputs
        shell: pwsh
        run: |
          $setup = "artifacts\WinShot_0.0.0-Setup.exe"
          if (-not (Test-Path $setup)) { throw "Missing $setup" }
          if (-not (Test-Path "WinShot-win-x64.zip")) { throw "Missing WinShot-win-x64.zip" }
          Get-Item $setup, WinShot-win-x64.zip | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}
