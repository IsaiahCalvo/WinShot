name: render-evidence

# Renders every non-editor surface (selector, corner card, pin, history, settings, recording
# HUD, scrolling chrome, video editor, the WPF and WinForms visual audits) to PNGs on a real
# Windows desktop and uploads them, so a polish pass can look at hover, focus and disabled
# states, spacing and DPI without a PC at hand. Runs only on PRs labelled `render-evidence`.

on:
  pull_request:
    branches: ['main']
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: render-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    if: contains(github.event.pull_request.labels.*.name, 'render-evidence')
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      OUT: ${{ github.workspace }}\render-out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Windows 10 SDK 10.0.19041 (UAP Platform.xml for CsWinRT)
        shell: pwsh
        run: choco install windows-sdk-10-version-2004-all -y --no-progress
      - name: Render
        shell: pwsh
        continue-on-error: true
        run: |
          $o = $env:OUT
          New-Item -ItemType Directory -Force $o | Out-Null
          $env:WINSHOT_RENDER_QUICK_ACCESS = '1'
          $env:WINSHOT_RENDER_SELECTOR = '1'
          $env:WINSHOT_RENDER_PIN = '1'
          $env:WINSHOT_RENDER_PIN_CORNERS = '1'
          $env:WINSHOT_RENDER_OUT = "$o\out"
          $env:WINSHOT_HISTORY_RENDER = '1'
          $env:WINSHOT_HISTORY_RENDER_DIR = "$o\history"
          $env:WINSHOT_RENDER = '1'
          $env:WINSHOT_RENDER_DIR = "$o\settings"
          $env:WINSHOT_VISUAL_AUDIT = '1'
          $env:WINSHOT_VISUAL_AUDIT_OUT = "$o\visual-audit"
          $env:WINSHOT_WINFORMS_AUDIT = '1'
          $env:WINSHOT_WINFORMS_AUDIT_OUT = "$o\winforms-audit"
          $env:WINSHOT_RECORDING_RENDER_DIR = "$o\recording"
          $env:WINSHOT_SCROLL_RENDER_DIR = "$o\scroll"
          $env:WINSHOT_VIDEO_EDITOR_RENDER_DIR = "$o\video-editor"
          $env:WINSHOT_MINIMAL_UI_OUT = "$o\minimal-ui"
          foreach ($d in 'out','history','settings','visual-audit','winforms-audit','recording','scroll','video-editor','minimal-ui') {
            New-Item -ItemType Directory -Force "$o\$d" | Out-Null
          }
          $classes = 'QuickAccessOverlayRenderHarness','SelectorRenderHarness','PinRenderHarness','HistoryRenderHarness','SettingsRenderHarness','WinFormsAuditHarness','RecordingHudRenderTests','RecordingIntegrationRenderHarness','ScrollingChromeRenderHarness','VideoEditorRenderHarness','SelectorMinimalUiTests'
          $filter = ($classes | ForEach-Object { "FullyQualifiedName~$_" }) -join '|'
          dotnet test tests/WinShot.Tests/WinShot.Tests.csproj -c Release --nologo --filter $filter --blame-hang-timeout 150s --blame-hang-dump-type none --logger "console;verbosity=normal" 2>&1 | Tee-Object -FilePath "$o\test-output.txt"
          # The WPF ink audit sweeps ~30 windows at four DPIs and is by far the slowest; it
          # runs on its own afterwards so a slow or stuck surface cannot cost the rest.
          dotnet test tests/WinShot.Tests/WinShot.Tests.csproj -c Release --nologo --no-build --filter "FullyQualifiedName~VisualAuditHarness" --blame-hang-timeout 600s --blame-hang-dump-type none --logger "console;verbosity=normal" 2>&1 | Tee-Object -FilePath "$o\test-output.txt" -Append
      - name: Print audit findings
        if: always()
        shell: pwsh
        run: |
          $o = $env:OUT
          # Least important first: the log tail is what gets read.
          Write-Host "== files per folder"
          Get-ChildItem -Recurse -File $o | Group-Object { $_.Directory.FullName.Substring($o.Length) } | ForEach-Object { Write-Host ("DIR " + $_.Name + " " + $_.Count) }
          Write-Host "== last visual-audit renders"
          Get-ChildItem -File (Join-Path $o "visual-audit") -Filter *.png -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 6 | ForEach-Object { Write-Host ("LAST " + $_.Name + " " + $_.LastWriteTime.ToString("HH:mm:ss")) }
          foreach ($f in "winforms-audit\noscale.tsv","visual-audit\states.tsv") {
            $p = Join-Path $o $f
            if (Test-Path $p) { Write-Host "== $f"; Get-Content $p | ForEach-Object { Write-Host "TSV $_" } }
          }
          foreach ($f in "visual-audit\audit.tsv","winforms-audit\audit.tsv") {
            $p = Join-Path $o $f
            if (-not (Test-Path $p)) { Write-Host "== $f missing"; continue }
            $rows = Get-Content $p
            $flagged = $rows | Select-Object -Skip 1 | Where-Object { ($_ -split "`t")[-1].Trim() -ne '' }
            Write-Host "== $f : $($rows.Count - 1) rows, $(@($flagged).Count) flagged"
            Write-Host $rows[0]
            $flagged | ForEach-Object { Write-Host "AUDIT $_" }
          }
          $t = Join-Path $o "test-output.txt"
          if (Test-Path $t) {
            Write-Host "== failed tests"
            Select-String -Path $t -Pattern '^\s+Failed |hang|Aborted|blame' -Context 0,8 | ForEach-Object { Write-Host "FAIL $($_.Line)"; $_.Context.PostContext | ForEach-Object { Write-Host "FAIL   $_" } }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-evidence
          path: render-out
          if-no-files-found: warn
